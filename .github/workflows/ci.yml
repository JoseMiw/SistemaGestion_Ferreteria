name: CI FerrePueblo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend - compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ferreteria_bd_v2?serverTimezone=America/Lima
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci_password

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Crear la base de datos de pruebas
        run: mysql -h 127.0.0.1 -uroot -pci_password --default-character-set=utf8mb4 < ScriptFerrepueblo_v3.sql

      - name: Compilar y ejecutar pruebas (JUnit 5 + Mockito)
        working-directory: backend_FerrePueblo/backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-backend
          path: backend_FerrePueblo/backend/target/surefire-reports/

  frontend:
    name: Frontend - compilar Angular
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FerrePueblo/package-lock.json

      - name: Instalar dependencias
        working-directory: FerrePueblo
        run: npm ci

      - name: Compilar
        working-directory: FerrePueblo
        run: npm run build