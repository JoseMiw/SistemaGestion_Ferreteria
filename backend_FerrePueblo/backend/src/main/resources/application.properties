spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria_bd_v2?serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# Desactiva la estrategia de nomenclatura física
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Incluye el mensaje de ResponseStatusException en la respuesta de error (err.error.message en Angular)
server.error.include-message=always

# ===== Seguridad (RF08, RF09, RNF01) =====
# Clave para firmar los tokens JWT (en producción, la variable de entorno JWT_SECRET la reemplaza)
jwt.secret=o+tgJ8J+fO3CxzNAlMi0fYJVH+0P98arcaNidypF9XMEY0Ti9j9XQaA4IXMsmZ7t
# Duración del token: 8 horas (una jornada de trabajo)
jwt.expiracion-minutos=480
# Bloqueo de cuenta: 5 intentos fallidos consecutivos bloquean 15 minutos
seguridad.max-intentos=5
seguridad.minutos-bloqueo=15

# Zona horaria del negocio (fechas de venta, devolución y entregas)
app.zona-horaria=America/Lima
