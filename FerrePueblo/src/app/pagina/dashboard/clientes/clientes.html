<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h4 class="mb-0">
                    <i class="fa-solid fa-users me-2"></i>
                    Buscar Cliente
                </h4>

                <button class="btn btn-light" (click)="nuevoCliente()">
                    <i class="fa-solid fa-plus me-1"></i>
                    Nuevo Cliente
                </button>

            </div>

        </div>

        <div class="card-body">

            <!-- CAMPO DE BÚSQUEDA -->
            <div class="row mb-3">
                <div class="col-md-5">
                    <label for="cli-buscar-campo-1" class="form-label fw-bold">DNI del cliente:</label>
                    <div class="d-flex gap-2">
                        <input id="cli-buscar-campo-1"
                            type="text"
                            inputmode="numeric"
                            maxlength="8"
                            class="form-control"
                            [(ngModel)]="dniCliente"
                            (keyup.enter)="buscarCliente()"
                            placeholder="Ingrese DNI (8 dígitos)"
                            aria-describedby="cli-buscar-mensaje"
                            style="max-width: 220px;">
                        <button class="btn btn-primary" (click)="buscarCliente()" style="white-space: nowrap;">
                            <i class="fa-solid fa-magnifying-glass me-1" aria-hidden="true"></i>
                            Buscar
                        </button>
                    </div>
                    <div id="cli-buscar-mensaje" class="text-danger mt-1" role="alert">{{ mensajeBusqueda }}</div>
                </div>
            </div>

            <!-- TABLA DE CLIENTES -->
            <table class="table table-striped table-hover">

                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let item of clientes">
                        <td>{{ item.dni }}</td>
                        <td>{{ item.nombres }}</td>
                        <td>{{ item.apellidos }}</td>
                        <td>{{ item.telefono }}</td>
                        <td>{{ item.correo }}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-2" *ngIf="tienePermiso('editar_clientes')" (click)="editar(item.idCliente)">
                                <i class="fa-solid fa-pen-to-square"></i> Editar
                            </button>
                            <button class="btn btn-sm btn-danger" *ngIf="tienePermiso('eliminar_clientes')" (click)="eliminar(item.idCliente)">
                                <i class="fa-solid fa-trash-can"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="clientes.length === 0">
                        <td colspan="6" class="text-center text-muted">
                            Ingrese el DNI del cliente y presione Buscar
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>
